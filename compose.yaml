# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    ports:
      - "54032:5432"
    environment:
      POSTGRES_USER: okante
      POSTGRES_PASSWORD: okante123456
      POSTGRES_DB: school

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
